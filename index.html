<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NOOB CUP ROULETTE</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

    <div class="logo">NOOB.</div>

    <div class="tagline">
      You bought coffee. Now gamble responsibly. ☕
    </div>

    <div class="card">

      <h2>CUP ROULETTE 🎰</h2>

      <p class="subtitle">
        Enter your cup number to spin.
      </p>
      <div class="pointer"></div>

<div class="wheel" id="wheel"></div>

      <input
        type="number"
        id="cupNumber"
        min="1"
        max="100"
        placeholder="037"
      >

      <button onclick="spin()">
        SPIN 🎰
      </button>

      <div id="result"></div>

    </div>

    <div class="footer">
      NOOB COFFEE · HYDERABAD
    </div>

  </div>

<script>

let spinning = false;

function spin() {

  if (spinning) return;

  const cup = document.getElementById("cupNumber").value;
  const result = document.getElementById("result");
  const wheel = document.getElementById("wheel");

  if (!cup || cup < 1 || cup > 100) {
    result.innerText =
      "Enter a cup number from #001 to #100 😭";
    return;
  }

  spinning = true;

  result.innerText = "🎰 SPINNING...";

  const rotation =
    1440 + Math.floor(Math.random() * 1440);

  wheel.style.transform =
    `rotate(${rotation}deg)`;

  setTimeout(() => {

    const prizes = [
      "☕ FREE COFFEE",
      "💸 50% OFF",
      "🍪 FREE ADD-ON",
      "😎 20% OFF",
      "😭 YOU'RE A NOOB",
      "🔥 FREE UPGRADE"
    ];

    const prize =
      prizes[Math.floor(Math.random() * prizes.length)];

    result.innerText =
      `YOU GOT: ${prize}`;

    spinning = false;

  }, 3000);

}

</script>

</body>
</html>
