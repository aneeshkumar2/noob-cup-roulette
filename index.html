<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NOOB. | Scratch</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="page">

    <div class="logo">NOOB.</div>

    <p class="tagline">
      YOU BOUGHT COFFEE. NOW GET SOMETHING.
    </p>


    <section class="card">

      <h1>NOOB SCRATCH</h1>

      <p class="subtitle">
        Enter the number on your cup.
      </p>


      <input
        id="cupNumber"
        type="number"
        min="1"
        max="100"
        placeholder="037"
      >


      <button
        id="revealButton"
        onclick="startScratch()"
      >
        REVEAL MY PRIZE
      </button>


      <div
        id="scratchArea"
        class="scratch-area hidden"
      >

        <canvas
          id="scratchCanvas"
        ></canvas>

        <div
          id="prize"
          class="prize"
        >
          ☕<br>
          <strong>FREE COFFEE</strong>
        </div>

      </div>


      <p
        id="message"
        class="message"
      ></p>

    </section>


    <p class="footer">
      NOOB COFFEE · HYDERABAD
    </p>

  </main>


<script>

let canvas;
let ctx;
let scratching = false;


function startScratch() {

  const cup =
    document.getElementById("cupNumber").value;

  const message =
    document.getElementById("message");

  const area =
    document.getElementById("scratchArea");

  const button =
    document.getElementById("revealButton");


  if (!cup || cup < 1 || cup > 100) {

    message.innerText =
      "Enter a cup number from #001 to #100 😭";

    return;

  }


  message.innerText =
    "SCRATCH TO FIND OUT 👀";

  area.classList.remove("hidden");

  button.disabled = true;


  setupCanvas();

}


function setupCanvas() {

  canvas =
    document.getElementById("scratchCanvas");

  ctx =
    canvas.getContext("2d");


  const rect =
    canvas.getBoundingClientRect();


  canvas.width =
    rect.width * window.devicePixelRatio;

  canvas.height =
    rect.height * window.devicePixelRatio;


  ctx.scale(
    window.devicePixelRatio,
    window.devicePixelRatio
  );


  ctx.fillStyle = "#777";

  ctx.fillRect(
    0,
    0,
    rect.width,
    rect.height
  );


  ctx.fillStyle = "#fff";

  ctx.font =
    "900 16px Arial";

  ctx.textAlign =
    "center";

  ctx.fillText(
    "SCRATCH HERE 👆",
    rect.width / 2,
    rect.height / 2
  );


  canvas.addEventListener(
    "pointerdown",
    startScratchAction
  );

  canvas.addEventListener(
    "pointermove",
    scratch
  );

  canvas.addEventListener(
    "pointerup",
    stopScratch
  );

  canvas.addEventListener(
    "pointerleave",
    stopScratch
  );

}


function startScratchAction(e) {

  scratching = true;

  scratch(e);

}


function stopScratch() {

  scratching = false;

}


function scratch(e) {

  if (!scratching) return;


  const rect =
    canvas.getBoundingClientRect();


  const x =
    e.clientX - rect.left;

  const y =
    e.clientY - rect.top;


  ctx.globalCompositeOperation =
    "destination-out";


  ctx.beginPath();

  ctx.arc(
    x,
    y,
    22,
    0,
    Math.PI * 2
  );

  ctx.fill();


  checkProgress();

}


function checkProgress() {

  const pixels =
    ctx.getImageData(
      0,
      0,
      canvas.width,
      canvas.height
    ).data;


  let transparent = 0;


  for (
    let i = 3;
    i < pixels.length;
    i += 4
  ) {

    if (pixels[i] < 100) {

      transparent++;

    }

  }


  const percentage =
    transparent /
    (pixels.length / 4);


  if (percentage > 0.45) {

    canvas.style.display =
      "none";

    document.getElementById(
      "message"
    ).innerText =
      "🎉 YOU FOUND IT!";

  }

}

</script>

</body>

</html>
