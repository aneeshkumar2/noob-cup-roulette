<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOOB. CUP ROULETTE</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="container">

    <div class="logo">NOOB.</div>

    <p class="tagline">
      Your cup. Your luck. Don't be a noob.
    </p>

    <section class="card">

      <h1>CUP ROULETTE</h1>

      <p class="subtitle">
        Enter the number on your cup.
      </p>

      <div class="wheel-area">

        <div class="pointer">▼</div>

        <svg
          class="wheel"
          id="wheel"
          viewBox="0 0 300 300"
        >

          <!-- Wheel sections -->

          <path
            d="M150 150 L150 10 A140 140 0 0 1 271.24 80 Z"
            class="slice light"
          />

          <path
            d="M150 150 L271.24 80 A140 140 0 0 1 271.24 220 Z"
            class="slice dark"
          />

          <path
            d="M150 150 L271.24 220 A140 140 0 0 1 150 290 Z"
            class="slice light"
          />

          <path
            d="M150 150 L150 290 A140 140 0 0 1 28.76 220 Z"
            class="slice dark"
          />

          <path
            d="M150 150 L28.76 220 A140 140 0 0 1 28.76 80 Z"
            class="slice light"
          />

          <path
            d="M150 150 L28.76 80 A140 140 0 0 1 150 10 Z"
            class="slice dark"
          />

          <!-- Prize labels -->

          <text x="215" y="65" class="label light-text">
            FREE
          </text>
          <text x="215" y="80" class="label light-text">
            COFFEE
          </text>

          <text x="240" y="150" class="label dark-text">
            50% OFF
          </text>

          <text x="205" y="230" class="label light-text">
            FREE
          </text>
          <text x="205" y="245" class="label light-text">
            ADD-ON
          </text>

          <text x="85" y="245" class="label dark-text">
            20% OFF
          </text>

          <text x="35" y="155" class="label light-text">
            NOOB 😭
          </text>

          <text x="75" y="70" class="label dark-text">
            UPGRADE
          </text>

          <!-- Center -->

          <circle
            cx="150"
            cy="150"
            r="35"
            class="center"
          />

          <text
            x="150"
            y="155"
            class="center-text"
            text-anchor="middle"
          >
            NOOB.
          </text>

        </svg>

      </div>

      <input
        type="number"
        id="cupNumber"
        min="1"
        max="100"
        placeholder="037"
      >

      <button id="spinButton" onclick="spin()">
        SPIN 🎰
      </button>

      <div id="result"></div>

    </section>

    <p class="footer">
      NOOB COFFEE · HYDERABAD
    </p>

  </main>


  <script>

    let spinning = false;
    let currentRotation = 0;

    function spin() {

      if (spinning) return;

      const cup =
        document.getElementById("cupNumber").value;

      const result =
        document.getElementById("result");

      const wheel =
        document.getElementById("wheel");

      const button =
        document.getElementById("spinButton");


      // Check cup number

      if (!cup || cup < 1 || cup > 100) {

        result.innerText =
          "Enter a cup number from #001 to #100 😭";

        return;
      }


      // Start spinning

      spinning = true;

      button.disabled = true;

      result.innerText =
        "🎰 SPINNING...";


      // Random number of full rotations

      const extraRotation =
        1800 + Math.floor(Math.random() * 1800);

      currentRotation += extraRotation;


      wheel.style.transform =
        `rotate(${currentRotation}deg)`;


      // Show result

      setTimeout(function() {

        const prizes = [
          "☕ FREE COFFEE",
          "💸 50% OFF",
          "🍪 FREE ADD-ON",
          "😎 20% OFF",
          "😭 YOU'RE A NOOB",
          "🔥 FREE UPGRADE"
        ];


        const prize =
          prizes[Math.floor(Math.random() * prizes.length)];


        result.innerHTML =
          "YOU GOT:<br><strong>" +
          prize +
          "</strong>";


        spinning = false;

        button.disabled = false;

      }, 3000);

    }

  </script>

</body>
</html>
