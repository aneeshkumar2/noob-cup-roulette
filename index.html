<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>NOOB. | Scratch</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #101010;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
      text-align: center;
    }

    .page {
      width: 100%;
      max-width: 430px;
      margin: auto;
      padding: 35px 18px;
    }

    /* LOGO */

    .logo-image {
      width: 230px;
      max-width: 80%;
      height: auto;
      display: block;
      margin: 0 auto 18px;
      border-radius: 8px;
    }

    .tagline {
      color: #777;
      font-size: 10px;
      letter-spacing: 1.5px;
      margin-bottom: 30px;
    }

    /* MAIN CARD */

    .card {
      background: #1b1b1b;
      border: 1px solid #333;
      border-radius: 24px;
      padding: 30px 20px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 25px;
    }

    .subtitle {
      color: #888;
      font-size: 13px;
      margin-bottom: 22px;
    }

    /* INPUT */

    input {
      width: 100%;
      height: 55px;
      border-radius: 12px;
      border: 1px solid #444;
      background: #111;
      color: white;
      text-align: center;
      font-size: 18px;
      outline: none;
      margin-bottom: 12px;
    }

    input::placeholder {
      color: #666;
    }

    /* BUTTON */

    button {
      width: 100%;
      height: 55px;
      border: none;
      border-radius: 12px;
      background: white;
      color: #111;
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.98);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* SCRATCH CARD */

    .scratch-area {
      position: relative;
      width: 100%;
      height: 180px;
      margin-top: 22px;
      border-radius: 16px;
      overflow: hidden;
      background: white;
    }

    .prize {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #111;
      font-size: 35px;
      line-height: 1.3;
      text-align: center;
      padding: 15px;
    }

    .prize strong {
      font-size: 21px;
    }

    #scratchCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 5;
      touch-action: none;
      cursor: pointer;
    }

    .hidden {
      display: none;
    }

    /* MESSAGE */

    .message {
      min-height: 25px;
      margin-top: 18px;
      font-size: 15px;
      font-weight: 900;
    }

    /* FOOTER */

    .footer {
      margin-top: 22px;
      color: #555;
      font-size: 10px;
      letter-spacing: 1.5px;
    }

  </style>

</head>


<body>

  <main class="page">


    <!-- NOOB COFFEE LOGO -->

    <img
      src="logo.PNG"
      class="logo-image"
      alt="Noob Coffee"
    >


    <p class="tagline">
      YOU BOUGHT COFFEE. NOW GET SOMETHING.
    </p>


    <section class="card">


      <h1>
        NOOB SCRATCH
      </h1>


      <p class="subtitle">
        Enter the number on your cup.
      </p>


      <input
        id="cupNumber"
        type="number"
        min="1"
        max="100"
        placeholder="037"
      >


      <button
        id="revealButton"
        onclick="startScratch()"
      >
        REVEAL MY PRIZE
      </button>


      <div
        id="scratchArea"
        class="scratch-area hidden"
      >


        <canvas
          id="scratchCanvas"
        ></canvas>


        <div
          id="prize"
          class="prize"
        >

          ☕
          <br>

          <strong>
            YOUR PRIZE
          </strong>

        </div>


      </div>


      <p
        id="message"
        class="message"
      ></p>


    </section>


    <p class="footer">
      NOOB COFFEE · HYDERABAD
    </p>


  </main>


<script>


/* ================================= */
/* SUPABASE */
/* ================================= */


const SUPABASE_URL =
  "https://xgcuukfgtrxnlvtdhxcg.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_-69XmiwE5j8ljDWQ-bl3WQ_b8gYblfC";


/* ================================= */
/* SCRATCH VARIABLES */
/* ================================= */


let canvas;
let ctx;

let scratching = false;

let alreadyStarted = false;


/* ================================= */
/* START REVEAL */
/* ================================= */


async function startScratch() {


  if (alreadyStarted) {
    return;
  }


  const cup =
    document.getElementById(
      "cupNumber"
    ).value;


  const message =
    document.getElementById(
      "message"
    );


  const area =
    document.getElementById(
      "scratchArea"
    );


  const button =
    document.getElementById(
      "revealButton"
    );


  /* CHECK CUP NUMBER */


  if (
    !cup ||
    cup < 1 ||
    cup > 100
  ) {

    message.innerText =
      "Enter a cup number from #001 to #100 😭";

    return;

  }


  /* LOADING */


  message.innerText =
    "CHECKING YOUR CUP... 👀";


  button.disabled = true;


  try {


    /* SEND CUP NUMBER TO SUPABASE */


    const response =
      await fetch(

        SUPABASE_URL +
        "/rest/v1/rpc/spin_cup",

        {

          method: "POST",

          headers: {

            "Content-Type":
              "application/json",

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              "Bearer " +
              SUPABASE_KEY

          },

          body:
            JSON.stringify({

              cup_num:
                Number(cup)

            })

        }

      );


    const data =
      await response.json();


    console.log(
      "Supabase response:",
      data
    );


    /* ERROR */


    if (!response.ok) {

      console.error(
        "Supabase error:",
        data
      );

      message.innerText =
        "Something went wrong 😭";

      button.disabled = false;

      return;

    }


    /* CUP ALREADY USED */


    if (!data.success) {

      message.innerText =
        data.message ||
        "This cup has already been used 😭";

      button.disabled = false;

      return;

    }


    /* ================================= */
    /* SHOW THE REAL RANDOM PRIZE */
    /* ================================= */


    document.getElementById(
      "prize"
    ).innerHTML =

      "☕<br><strong>" +
      data.prize +
      "</strong>";


    /* SHOW SCRATCH AREA */


    area.classList.remove(
      "hidden"
    );


    message.innerText =
      "SCRATCH TO FIND OUT 👀";


    alreadyStarted = true;


    /* CREATE SCRATCH LAYER */


    setupCanvas();


  }

  catch (error) {


    console.error(
      "Connection error:",
      error
    );


    message.innerText =
      "Connection error. Try again 😭";


    button.disabled = false;

  }

}


/* ================================= */
/* SETUP SCRATCH CARD */
/* ================================= */


function setupCanvas() {


  canvas =
    document.getElementById(
      "scratchCanvas"
    );


  ctx =
    canvas.getContext(
      "2d"
    );


  const rect =
    canvas.getBoundingClientRect();


  const dpr =
    window.devicePixelRatio ||
    1;


  canvas.width =
    rect.width * dpr;


  canvas.height =
    rect.height * dpr;


  ctx.scale(
    dpr,
    dpr
  );


  /* SCRATCH SURFACE */


  ctx.fillStyle =
    "#777";


  ctx.fillRect(

    0,
    0,
    rect.width,
    rect.height

  );


  /* SCRATCH TEXT */


  ctx.fillStyle =
    "#fff";


  ctx.font =
    "900 16px Arial";


  ctx.textAlign =
    "center";


  ctx.textBaseline =
    "middle";


  ctx.fillText(

    "SCRATCH HERE 👆",

    rect.width / 2,

    rect.height / 2

  );


  /* TOUCH EVENTS */


  canvas.addEventListener(
    "pointerdown",
    startScratchAction
  );


  canvas.addEventListener(
    "pointermove",
    scratch
  );


  canvas.addEventListener(
    "pointerup",
    stopScratch
  );


  canvas.addEventListener(
    "pointercancel",
    stopScratch
  );


  canvas.addEventListener(
    "pointerleave",
    stopScratch
  );

}


/* ================================= */
/* START SCRATCHING */
/* ================================= */


function startScratchAction(e) {


  scratching = true;


  try {

    canvas.setPointerCapture(
      e.pointerId
    );

  }

  catch (error) {

    console.log(error);

  }


  scratch(e);

}


/* ================================= */
/* STOP SCRATCHING */
/* ================================= */


function stopScratch() {

  scratching = false;

}


/* ================================= */
/* SCRATCH ACTION */
/* ================================= */


function scratch(e) {


  if (!scratching) {
    return;
  }


  const rect =
    canvas.getBoundingClientRect();


  const x =
    e.clientX -
    rect.left;


  const y =
    e.clientY -
    rect.top;


  /* ERASE THE SCRATCH LAYER */


  ctx.globalCompositeOperation =
    "destination-out";


  ctx.beginPath();


  ctx.arc(

    x,
    y,
    24,
    0,
    Math.PI * 2

  );


  ctx.fill();


  checkProgress();

}


/* ================================= */
/* CHECK SCRATCH PROGRESS */
/* ================================= */


function checkProgress() {


  const pixels =
    ctx.getImageData(

      0,
      0,
      canvas.width,
      canvas.height

    ).data;


  let transparent = 0;


  for (

    let i = 3;

    i < pixels.length;

    i += 4

  ) {


    if (
      pixels[i] < 100
    ) {

      transparent++;

    }

  }


  const percentage =
    transparent /
    (pixels.length / 4);


  /* REVEAL WHEN 45% IS SCRATCHED */


  if (
    percentage > 0.45
  ) {


    canvas.style.display =
      "none";


    document.getElementById(
      "message"
    ).innerText =
      "🎉 YOU FOUND IT!";


  }

}


</script>

</body>

</html>
