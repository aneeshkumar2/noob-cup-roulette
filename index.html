<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NOOB CUP ROULETTE</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="container">

    <div class="logo">NOOB.</div>

    <p class="tagline">
      You bought coffee. Now gamble responsibly. ☕
    </p>

    <section class="card">

      <h1>CUP ROULETTE 🎰</h1>

      <p class="subtitle">
        Enter your cup number to spin.
      </p>

      <div class="wheel-wrap">

        <div class="pointer">▼</div>

        <div class="wheel" id="wheel">

          <div class="wheel-text text1">
            FREE<br>COFFEE
          </div>

          <div class="wheel-text text2">
            50% OFF
          </div>

          <div class="wheel-text text3">
            FREE<br>ADD-ON
          </div>

          <div class="wheel-text text4">
            20% OFF
          </div>

          <div class="wheel-text text5">
            NOOB 😭
          </div>

          <div class="wheel-text text6">
            UPGRADE
          </div>

          <div class="wheel-center">
            NOOB.
          </div>

        </div>

      </div>

      <input
        type="number"
        id="cupNumber"
        min="1"
        max="100"
        placeholder="037"
      >

      <button id="spinButton" onclick="spin()">
        SPIN 🎰
      </button>

      <div id="result"></div>

    </section>

    <p class="footer">
      NOOB COFFEE · HYDERABAD
    </p>

  </main>

  <script>

    let spinning = false;

    function spin() {

      if (spinning) return;

      const cup =
        document.getElementById("cupNumber").value;

      const result =
        document.getElementById("result");

      const wheel =
        document.getElementById("wheel");

      if (!cup || cup < 1 || cup > 100) {

        result.innerText =
          "Enter a cup number from #001 to #100 😭";

        return;
      }

      spinning = true;

      result.innerText = "🎰 SPINNING...";

      const rotation =
        1440 + Math.floor(Math.random() * 2160);

      wheel.style.transform =
        `rotate(${rotation}deg)`;

      setTimeout(function () {

        const prizes = [
          "☕ FREE COFFEE",
          "💸 50% OFF",
          "🍪 FREE ADD-ON",
          "😎 20% OFF",
          "😭 YOU'RE A NOOB",
          "🔥 FREE UPGRADE"
        ];

        const prize =
          prizes[Math.floor(Math.random() * prizes.length)];

        result.innerText =
          "YOU GOT: " + prize;

        spinning = false;

      }, 3000);

    }

  </script>

</body>

</html>
