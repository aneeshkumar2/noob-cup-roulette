<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOOB. | Cup Roulette</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="page">

    <div class="brand">NOOB.</div>

    <div class="tagline">
      YOUR CUP. YOUR LUCK.
    </div>

    <div class="box">

      <h1>CUP ROULETTE</h1>

      <p class="instruction">
        Enter the number printed on your cup.
      </p>


      <!-- WHEEL -->

      <div class="roulette">

        <div class="pointer">▼</div>

        <div class="wheel" id="wheel">

          <div class="segment segment1">
            <span>FREE<br>COFFEE</span>
          </div>

          <div class="segment segment2">
            <span>50%<br>OFF</span>
          </div>

          <div class="segment segment3">
            <span>FREE<br>ADD-ON</span>
          </div>

          <div class="segment segment4">
            <span>20%<br>OFF</span>
          </div>

          <div class="segment segment5">
            <span>NOOB<br>😭</span>
          </div>

          <div class="segment segment6">
            <span>FREE<br>UPGRADE</span>
          </div>

          <div class="wheel-center">
            NOOB.
          </div>

        </div>

      </div>


      <!-- CUP NUMBER -->

      <label for="cupNumber">
        CUP NUMBER
      </label>

      <input
        id="cupNumber"
        type="number"
        min="1"
        max="100"
        placeholder="037"
      >


      <!-- BUTTON -->

      <button
        id="spinButton"
        onclick="spin()"
      >
        SPIN 🎰
      </button>


      <!-- RESULT -->

      <div id="result"></div>

    </div>


    <div class="footer">
      NOOB COFFEE · HYDERABAD
    </div>

  </div>


<script>

let spinning = false;
let rotation = 0;

function spin() {

  if (spinning) return;

  const cup =
    document.getElementById("cupNumber").value;

  const wheel =
    document.getElementById("wheel");

  const result =
    document.getElementById("result");

  const button =
    document.getElementById("spinButton");


  if (!cup || cup < 1 || cup > 100) {

    result.innerHTML =
      "Enter a cup number between <b>#001–#100</b> 😭";

    return;
  }


  spinning = true;

  button.disabled = true;

  result.innerHTML = "SPINNING... 🎰";


  rotation +=
    1800 +
    Math.floor(Math.random() * 1800);


  wheel.style.transform =
    `rotate(${rotation}deg)`;


  setTimeout(() => {

    const prizes = [

      "☕ FREE COFFEE",

      "💸 50% OFF",

      "🍪 FREE ADD-ON",

      "😎 20% OFF",

      "😭 YOU'RE A NOOB",

      "🔥 FREE UPGRADE"

    ];


    const prize =
      prizes[
        Math.floor(
          Math.random() * prizes.length
        )
      ];


    result.innerHTML =
      "YOU GOT<br><strong>" +
      prize +
      "</strong>";


    spinning = false;

    button.disabled = false;

  }, 3000);

}

</script>

</body>
</html>
